name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check.py
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python tools/release_inventory.py --check
      - run: python -m build
      - run: python tools/verify_package.py dist/*.whl dist/*.tar.gz
